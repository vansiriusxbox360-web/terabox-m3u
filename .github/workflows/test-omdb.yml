name: Test OMDb quota

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Single OMDb call
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          curl -s "https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&t=Overlord&type=series" | head -c 600
          echo ""
