name: Generate M3U from Terabox

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate M3U
        id: generate
        env:
          TERABOX_NDUS: ${{ secrets.TERABOX_NDUS }}
          TERABOX_EMAIL: ${{ secrets.TERABOX_EMAIL }}
          TERABOX_PASSWORD: ${{ secrets.TERABOX_PASSWORD }}
        run: |
          node index.js
          if [ $? -ne 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Upload M3U to Release
        if: steps.generate.outputs.status != 'failed'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 'M3U Actualizado'
          body: |
            Lista M3U generada automaticamente.
            Fecha: ${{ github.event.head_commit.timestamp || github.event.schedule }}
          files: lista.m3u
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on failure
        if: failure() || steps.generate.outputs.status == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let errorMsg = 'Error desconocido al generar la M3U.';
            
            // Intentar leer el log para detectar error de token
            try {
              const logs = fs.readFileSync('/tmp/terabox_error.log', 'utf8');
              if (logs.includes('login') || logs.includes('425') || logs.includes('403') || logs.includes('cookie') || logs.includes('ndus')) {
                errorMsg = '🔴 **Token ndus caducado o invalido.**\n\nEl token de autenticacion de Terabox ha dejado de funcionar. Necesitas actualizarlo siguiendo estos pasos:\n\n1. Abre Firefox y ve a terabox.com (inicia sesion)\n2. Abre DevTools (F12) > pestaña Application > Cookies > terabox.com\n3. Copia el valor de la cookie **ndus**\n4. Ve a GitHub > Settings > Secrets > TERABOX_NDUS > Edit\n5. Pega el nuevo valor y haz clic en Update secret\n\nDespues de actualizar, ve a Actions > Run workflow para reintentar.';
              }
            } catch (e) {
              // Si no hay log, asumir error de token
              errorMsg = '🔴 **Posible token ndus caducado.**\n\nRevisa los logs del workflow para mas detalles.\n\nPara actualizar el token:\n1. Ve a terabox.com en Firefox\n2. DevTools (F12) > Application > Cookies > ndus\n3. Actualiza el secret TERABOX_NDUS en GitHub';
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 Token Terabox necesita actualizacion',
              body: errorMsg,
              labels: ['token-expired']
            });
