name: Generate M3U from Terabox

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate M3U
        id: generate
        env:
          TERABOX_NDUS: ${{ secrets.TERABOX_NDUS }}
          TERABOX_EMAIL: ${{ secrets.TERABOX_EMAIL }}
          TERABOX_PASSWORD: ${{ secrets.TERABOX_PASSWORD }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          node index.js
          if [ $? -ne 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push M3U
        if: steps.generate.outputs.status != 'failed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lista.m3u
          git diff --cached --quiet || git commit -m "Update lista.m3u - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Create issue on failure
        if: failure() || steps.generate.outputs.status == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let errorMsg = 'Error desconocido al generar la M3U.';
            
            try {
              const logs = fs.readFileSync('/tmp/terabox_error.log', 'utf8');
              if (logs.includes('login') || logs.includes('425') || logs.includes('403') || logs.includes('cookie') || logs.includes('ndus')) {
                errorMsg = '🔴 **Token ndus caducado o invalido.**\n\nActualiza el token:\n\n1. Abre Firefox y ve a terabox.com (inicia sesion)\n2. DevTools (F12) > Application > Cookies > terabox.com\n3. Copia el valor de la cookie **ndus**\n4. Ve a GitHub > Settings > Secrets > TERABOX_NDUS > Edit\n5. Pega el nuevo valor\n\nDespues ve a Actions > Run workflow para reintentar.';
              }
            } catch (e) {
              errorMsg = '🔴 **Posible token ndus caducado.** Actualiza TERABOX_NDUS en GitHub.';
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 Token Terabox necesita actualizacion',
              body: errorMsg,
              labels: ['token-expired']
            });
